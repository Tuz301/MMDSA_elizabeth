# Continuous integration. Every push and pull request runs the full backend
# suite, the dashboard type-check, tests and build, and a synthesis of the
# CDK stacks — so a change that breaks any of the three surfaces cannot land
# quietly. Deployment stays a deliberate act (cdk deploy from an operator's
# session) until the pilot's change-control process says otherwise.

name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check apps/ config/ tests/
      - name: Run the test suite
        run: python -m pytest tests/ -q
        env:
          USE_SQLITE: "1"
      - name: The OpenAPI schema must generate without warnings
        run: python manage.py spectacular --fail-on-warn > /dev/null
        env:
          USE_SQLITE: "1"

  dashboard:
    name: Dashboard type-check, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  infra:
    name: CDK synthesis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - run: npx cdk synth --context env=pilot --quiet
